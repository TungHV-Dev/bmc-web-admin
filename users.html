<div class="modal-backdrop" id="addUserModal"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>Thêm người dùng</h2><p>Tạo tài khoản và gán vai trò ngay khi tạo.</p></div><button class="close-btn" type="button" data-close-modal aria-label="Đóng"><svg class="icon"><use href="#i-close"/></svg></button></div>
  <form class="modal-form" id="addUserForm">
    <div class="form-row"><div class="form-field"><label>Họ tên<em>*</em></label><input required placeholder="Nguyễn Văn A"></div><div class="form-field"><label>Email<em>*</em></label><input type="email" required placeholder="ten@bmc.edu.vn"></div></div>
    <div class="form-field"><label>Vai trò<em>*</em></label><select required>
      <option value="">Chọn vai trò</option><option>Admin</option><option>Giáo viên</option><option>Trợ giảng</option><option>Học sinh</option><option>Trưởng nhóm trợ giảng (tuỳ chỉnh)</option>
    </select></div>
    <p class="form-hint">Mật khẩu tạm thời và email kích hoạt sẽ được gửi tự động ở bản production (PORTAL-13).</p>
    <button class="btn btn-primary" type="submit" style="width:100%">Tạo người dùng</button>
  </form>
</section></div>

<script src="shared-admin.js" defer></script>
<script defer>
window.addEventListener('DOMContentLoaded', () => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const modal = $('#addUserModal');
  function lock(open){ document.body.classList.toggle('locked', open); }
  $$('[data-open-modal]').forEach(x => x.addEventListener('click', () => { document.getElementById(x.dataset.openModal).classList.add('open'); lock(true); }));
  $$('[data-close-modal]').forEach(x => x.addEventListener('click', () => { x.closest('.modal-backdrop').classList.remove('open'); lock(false); }));
  modal?.addEventListener('click', e => { if (e.target === modal) { modal.classList.remove('open'); lock(false); } });
  $('#addUserForm')?.addEventListener('submit', e => { e.preventDefault(); modal.classList.remove('open'); lock(false); window.bmcAdminToast('Đã tạo người dùng mới (mô phỏng)'); });

  function applyFilters() {
    const q = ($('#userSearch').value || '').trim().toLocaleLowerCase('vi');
    const role = $('.chip.active')?.dataset.roleFilter || 'all';
    let count = 0;
    $$('#userTable tbody tr').forEach(row => {
      const matchRole = role === 'all' || row.dataset.role === role;
      const matchText = row.textContent.toLocaleLowerCase('vi').includes(q);
      const show = matchRole && matchText;
      row.hidden = !show; if (show) count++;
    });
    $('#userCount').textContent = `${count} người dùng minh hoạ`;
  }
  $('#userSearch').addEventListener('input', applyFilters);
  $$('[data-role-filter]').forEach(chip => chip.addEventListener('click', () => { $$('[data-role-filter]').forEach(c => c.classList.remove('active')); chip.classList.add('active'); applyFilters(); }));
});
</script>
